<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IU Student - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login">

        <div class="logo">
            IU
        </div>

        <div class="university">
            جامعة الإسراء
        </div>

        <h1 class="description">
            Isra University Library
        </h1>

        <div class="input">
            <label for="student-id">الرقم الجامعي</label>

            <input
                type="text"
                id="student-id"
                placeholder="ادخل الرقم الجامعي"
            >
        </div>

        <div class="input">
            <label for="password">كلمة السر</label>

            <input
                type="password"
                id="password"
                placeholder="ادخل كلمة المرور"
            >
        </div>

        <div>
          <form action="home.html">
          <button type="submit" class="login-button">
        تسجيل الدخول
        </button>
         </form>

         <p class="footer-text">
           منصة طلابية غير رسمية
        </p>
        </div>

    </div>

</body>
</html>
